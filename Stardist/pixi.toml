[workspace]
name = "Stardist"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.11.*"
cuda-version = "12.*"
tensorflow = { version = "*", build = "*cuda*" }
numpy = "<2"
scipy = "<1.14"
packaging = "<26"

[pypi-dependencies]
stardist = "*"
merge-stardist-masks = { path = "../merge-stardist-masks", editable = true }
