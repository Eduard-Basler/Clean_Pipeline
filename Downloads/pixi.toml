[workspace]
name = "data_management"
version = "0.1.0"
authors = ["basler0004"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
# Bio-Formats CLI tools (includes bfconvert)
bftools = ">=8.0.0,<9"
# OMERO CLI and Python library
omero-py = ">=5.21.2,<6"
# Core utilities from your list
pandas = ">=3.0.2,<4"
numpy = "<2.0.0"
bioio = ">=3.3.0,<4"
tifffile = ">=2026.3.3,<2027"
nd2 = ">=0.11.1,<0.12"
scikit-image = ">=0.26.0,<0.27"

[pypi-dependencies]
ezomero = "*"
python-dotenv = "*" # Helpful for hiding your OMERO password in a .env file

