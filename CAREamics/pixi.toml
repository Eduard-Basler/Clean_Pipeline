[workspace]
name = "careamics_ml"
version = "0.1.0"
authors = ["basler0004"]
channels = ["conda-forge", "pytorch", "nvidia", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# The Foundation for CUDA 13
python = "3.11.*"
numpy = "<2.0.0"
cuda-runtime = "13.*"
cupy = "*"
scipy = "<1.13"

[pypi-dependencies]
# THE GIT CLONE: Pulls Careamics and its core requirements from GitHub
careamics = "==0.1.0"

# Your specific Deep Learning stack for CUDA 13
torch = { version = "==2.9.0+cu130", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu130" }

# ML & Computer Vision Helpers
monai = "*"
einops = "*"
timm = "*"
lightning = "*"
scipy = "*"
opencv-python-headless = "*"
scikit-image = "*"
pydantic = "*"
